spring.application.name=awschallenge
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${RDS_URL}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=${RDS_DRIVER:org.postgresql.Driver}
hibernate.dialect=${RDS_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${RDS_DDL_AUTO:update}